"Bug Tracker" = "https://github.com/AceDataCloud/QwenImageComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Qwen Image by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/QwenImageComfyUI/main/assets/logo-400.png"
